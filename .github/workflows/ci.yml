name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor of the declared engines range, plus current LTS. The floor is
        # 20 because the identity function calls `globalThis.crypto.randomUUID`
        # — the Web Crypto global, available in a browser and in Node from 19 —
        # rather than `node:crypto`'s. Node 18 is end-of-life.
        node-version: ['20.x', '22.x']

    steps:
      - name: Check out sdk-typescript
        uses: actions/checkout@v4
        with:
          path: sdk-typescript

      # Several suites resolve shared fixtures at <parent>/conformance/fixtures/
      # via resolve(__dirname, '../../conformance/fixtures'), so conformance must
      # be a SIBLING of this checkout rather than a subdirectory. Note the failure
      # mode if this step is removed: readdirSync throws at collection time, so the
      # run fails loudly rather than quietly skipping the fixture-backed tests.
      - name: Check out conformance as a sibling
        uses: actions/checkout@v4
        with:
          repository: the-cascade-protocol/conformance
          path: conformance

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      # npm ci, never a node_modules symlink: a symlinked node_modules resolves
      # packages back to whatever tree it points at, which silently invalidates
      # everything the suite then claims to have tested.
      - name: Install
        working-directory: sdk-typescript
        run: npm ci

      - name: Build
        working-directory: sdk-typescript
        run: npm run build

      # vitest transpiles without typechecking and tsconfig.json excludes test
      # files, so a type-level assertion in a test is invisible to both `npm
      # test` and `npm run build`. This step is what makes the @ts-expect-error
      # assertions on narrowed public types real.
      - name: Typecheck
        working-directory: sdk-typescript
        run: npm run typecheck

      - name: Test
        working-directory: sdk-typescript
        run: npm test

  # The package must load in a browser: a Cascade pod is patient-carried data,
  # and the places a patient or caregiver meets it are overwhelmingly browsers
  # (a protocol playground, a desktop app's WebView renderer, any patient-facing
  # web app). This job is what makes that a checked property rather than an
  # intention — it is the reason a `node:crypto` import on the package barrel
  # cannot come back. It needs no conformance sibling: nothing here reads a
  # fixture, and the browser entry point must not touch the filesystem at all.
  browser-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sdk-typescript
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      # Bundles src/index.ts with esbuild for a browser target. An unresolved
      # `node:` builtin fails the bundle outright; a Node-only construct that
      # survives resolution (an externalized builtin, an interop `require`) is
      # caught by the scan of the output.
      - name: Bundle the public entry point for a browser
        run: npm run check:browser

      # The bundle building is not the same claim as the bundle working, so this
      # executes serialize / deserialize / validate / toJsonLd through the
      # bundled artefact.
      - name: Smoke-test the bundled API
        run: npx vitest run tests/browser-bundle.test.ts
